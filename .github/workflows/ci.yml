name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks
    uses: ./.github/workflows/run-static-checks.yml

  tests:
    name: Tests
    uses: ./.github/workflows/run-tests.yml

  system-tests:
    name: System Tests
    uses: ./.github/workflows/run-system-tests.yml

  react-doctor:
    name: React Doctor
    uses: ./.github/workflows/run-react-doctor.yml
